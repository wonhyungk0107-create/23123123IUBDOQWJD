[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# The URL is resolved in migrations/env.py from TRADEUP_DATABASE_URL so that the
# same settings object governs the application and its migrations. Leaving it blank
# here prevents a stale literal in this file from silently targeting the wrong
# database.
sqlalchemy.url =

# No post-write hooks. Generated revisions are formatted by `make format`, which
# runs ruff over the whole tree including migrations/ -- one formatter, one config,
# and no dependency on how the tool happens to be installed in this environment.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
