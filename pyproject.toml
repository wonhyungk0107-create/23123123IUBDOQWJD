[project]
name = "tradeup"
version = "0.1.0"
description = "Exact-asset, multi-market CS2 trade-up procurement agent (shadow mode)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "typer>=0.12",
    "polars>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "coverage[toml]>=7.5",
]

[project.scripts]
tradeup = "tradeup.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradeup"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # simplify
    "RUF",
]
ignore = [
    "E501",   # line length handled by formatter
    "N818",   # exception naming (our error types are domain nouns)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]

# ---------------------------------------------------------------------------
# Static typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/tradeup"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["polars.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Repository root on sys.path so `tests.factories` is importable from every module.
pythonpath = ["."]
# `not live` by default: the mandatory suite must never touch the public internet,
# even on a machine that happens to have credentials configured. `make live-smoke`
# opts in explicitly with `-m live`.
addopts = "-q --strict-markers --strict-config -m 'not live'"
markers = [
    "live: read-only network smoke tests; skipped unless credentials are present",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/tradeup"]
omit = ["src/tradeup/cli/*", "src/tradeup/persistence/migrations/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "raise AssertionError",
]
